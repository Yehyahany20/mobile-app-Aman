plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.yehya.aman"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.yehya.aman"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')

repositories {
    google()
    mavenCentral()
    if (flutterRoot != null) {
        maven { url "${flutterRoot}/bin/cache/artifacts/gradle_wrapper" }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core-ktx:1.12.0"
    if (flutterRoot != null) {
        debugImplementation files("${flutterRoot}/bin/cache/artifacts/engine/android-arm/flutter.jar")
        releaseImplementation files("${flutterRoot}/bin/cache/artifacts/engine/android-arm-release/flutter.jar")
    }
}
