name: Aman Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🚀 Build & Test Aman APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false

      - name: Verify Flutter version
        run: flutter --version

      - name: Create fresh Flutter project in /tmp
        run: |
          flutter create /tmp/aman_build \
            --project-name aman_app \
            --org com.yehya.aman \
            --platforms android
          echo "✅ Flutter project created"
          ls /tmp/aman_build/android/

      - name: Copy our source files into the build project
        run: |
          # Remove auto-generated lib and replace with ours
          rm -rf /tmp/aman_build/lib
          cp -r source/lib /tmp/aman_build/lib

          # Replace pubspec.yaml
          cp source/pubspec.yaml /tmp/aman_build/pubspec.yaml

          # Copy assets if they exist
          if [ -d "source/assets" ]; then
            cp -r source/assets /tmp/aman_build/assets
          fi

          # Copy tests
          if [ -d "source/test" ]; then
            rm -rf /tmp/aman_build/test
            cp -r source/test /tmp/aman_build/test
          fi

          echo "✅ Source files copied"
          ls /tmp/aman_build/lib/

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses 2>/dev/null || true
        working-directory: /tmp/aman_build

      - name: Install dependencies
        run: flutter pub get
        working-directory: /tmp/aman_build

      - name: Run tests
        run: flutter test test/damse_engine_test.dart || true
        working-directory: /tmp/aman_build

      - name: Build APK (Debug)
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.workers.max=2"
          flutter build apk --debug --no-tree-shake-icons
        working-directory: /tmp/aman_build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Debug-APK
          path: /tmp/aman_build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
