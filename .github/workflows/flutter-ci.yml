name: Aman Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Aman APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Check code formatting & analyze
        run: |
          flutter analyze || true

      - name: 🔨 Generate Android Project Template if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Flutter platform wrappers..."
            flutter create . --project-name aman_app --org com.yehya.aman
          fi

      - name: 🚀 Build APK (Release)
        run: flutter build apk --split-per-abi || flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Scam-Detector-APK
          path: build/app/outputs/flutter-apk/*.apk
