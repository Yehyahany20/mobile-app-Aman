name: Aman Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Dart Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test test/damse_engine_test.dart

  build-apk:
    name: 🚀 Build Android APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create . \
            --project-name aman_app \
            --org com.yehya.aman \
            --platforms android

      - name: Restore our source files
        run: |
          rm -rf lib/
          git checkout lib/
          git checkout pubspec.yaml
          git checkout test/ 2>/dev/null || true
          git checkout assets/ 2>/dev/null || true
          mkdir -p assets/images

      - name: Accept licenses & install deps
        run: |
          yes | flutter doctor --android-licenses || true
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
