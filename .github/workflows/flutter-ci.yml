name: Aman Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Aman APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📁 Ensure required directories exist
        run: |
          mkdir -p assets/images
          touch assets/images/.gitkeep

      - name: 🔨 Generate Android Platform Wrappers
        run: |
          flutter create . --project-name aman_app --org com.yehya.aman --platforms android

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Check code formatting & analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: 🚀 Build APK (Debug - Installs immediately on any phone)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 🚀 Build APK (Release)
        continue-on-error: true
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-App-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
