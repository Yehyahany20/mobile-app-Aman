name: Aman Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Aman App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📁 Ensure project assets & structure
        run: |
          mkdir -p assets/images
          touch assets/images/.gitkeep

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: 🔨 Generate Android Platform Wrappers
        run: |
          flutter create . --project-name aman_app --org com.yehya.aman --platforms android

      - name: 📦 Install dependencies
        run: |
          flutter pub get

      - name: 🧪 Run Automated Tests
        run: |
          flutter test test/damse_engine_test.dart

      - name: 🚀 Build APK (Debug)
        run: |
          flutter build apk --debug --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-App-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
