name: Aman Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Aman App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔖 Save project source files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r assets /tmp/assets_backup || true
          cp -r test /tmp/test_backup || true
          cp README.md /tmp/README.md.bak || true

      - name: 🏗️ Let Flutter generate the Android platform
        run: |
          flutter create . --project-name aman_app --org com.yehya.aman --platforms android

      - name: ♻️ Restore our actual source files
        run: |
          cp -r /tmp/lib_backup/* lib/
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp -r /tmp/assets_backup/* assets/ || true
          cp -r /tmp/test_backup/* test/ || true
          cp /tmp/README.md.bak README.md || true

      - name: 📜 Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🧪 Run Automated Tests
        run: flutter test test/damse_engine_test.dart

      - name: 🚀 Build APK (Debug)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-App-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
